<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みやび〜ぬ ゲーム公開診断</title><style>html{background:#231737;color:#fff;font-family:system-ui,sans-serif}body{margin:0;padding:24px 14px}main{max-width:620px;margin:auto;background:#35264f;padding:19px;border-radius:15px}h1{font-size:22px;margin:0 0 14px}.result{background:#1e1630;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px;font-size:14px;line-height:1.65}button{background:#e564a9;color:white;border:0;padding:13px 20px;border-radius:9px;font-weight:bold;margin-top:10px}small{color:#d3c6e3}a{color:#b5efff}</style></head>
<body><main><h1>みやび〜ぬ 公開ファイル診断</h1><p>この画面が見えれば、診断ファイルのHTML表示は成功です。</p><div id="report" class="result">index.html を調べています...</div><button id="retry">再チェック</button><button id="copy">結果をコピー</button><p><small>この診断は同じ公開フォルダの index.html のHTTP状態・ファイル容量・内容の先頭だけを確認します。個人情報やゲーム記録は取得・送信しません。</small></p></main>
<script>
'use strict';
const report=document.getElementById('report');
async function check(){let lines=['JavaScript：正常','現在のページ：'+location.pathname];try{
 const url=new URL('index.html', location.href);url.searchParams.set('diagnostic',Date.now());
 const response=await fetch(url,{cache:'no-store',redirect:'follow'});
 lines.push('index.html HTTP状態：'+response.status+' '+response.statusText);
 lines.push('Content-Type：'+(response.headers.get('content-type')||'不明'));
 const html=await response.text();
 lines.push('ファイルの文字数：'+html.length.toLocaleString('ja-JP'));
 lines.push('ファイルの先頭：'+JSON.stringify(html.slice(0,115)));
 const title=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
 lines.push('title：'+(title?title[1].slice(0,150):'なし'));
 lines.push('HTMLとして認識：'+(/^\s*<!doctype\s+html/i.test(html)||/^\s*<html/i.test(html)?'はい':'いいえ'));
 lines.push('ゲームの文字：'+(html.includes('ミラクルカクテル')?'あり':'なし'));
 lines.push('閉じHTMLタグ：'+(html.includes('</html>')?'あり':'なし'));
 if(response.status===404)lines.push('判断：ファイルが公開先にありません。main 直下の配置と公開結果を確認。');
 else if(html.length<1000)lines.push('判断：ゲーム本体としては短すぎます。アップロード時に内容が消えている可能性。');
 else if(html.length>10000)lines.push('判断：HTMLの配信はできています。白画面の場合は描画・JavaScriptエラーの調査へ。');
 }catch(e){lines.push('取得エラー：'+String(e));}
 report.textContent=lines.join('\n');}
document.getElementById('retry').addEventListener('click',check);
document.getElementById('copy').addEventListener('click',()=>{const t=report.textContent;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('診断結果をコピーしました'),()=>alert('結果を長押しでコピーしてください'));else alert('結果を長押しでコピーしてください');});
check();
</script></body></html>
